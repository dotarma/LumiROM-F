name: Lint

on:
  push:
    paths:
      - "**.sh"
      - "**.py"
      - ".shellcheckrc"
  pull_request:
    paths:
      - "**.sh"
      - "**.py"
  workflow_dispatch:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: bash syntax check
        run: |
          set -e
          for f in $(find scripts build_local.sh -name "*.sh"); do
            bash -n "$f"
          done
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "./scripts"
          severity: warning
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python3 -m py_compile scripts/package/upload_hf.py
          pip install -r requirements.txt
